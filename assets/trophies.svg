    <circle cx="70" cy="30" r="16" fill="#172554" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="70" y="36" text-anchor="middle" font-size="16">🔬</text>
    <text x="70" y="62" text-anchor="middle" class="tr-grade" fill="#60A5FA">SS+</text>
    <text x="70" y="77" text-anchor="middle" class="tr-title">IISc Research</text>
    <text x="70" y="90" text-anchor="middle" class="tr-desc">ACM Edge AI '26</text>
  </g>

  <!-- Trophy 6: Gemini Ambassador -->
