<svg width="500" height="200" viewBox="0 0 500 200" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hr_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="hr_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00EA64"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="0.5" y="0.5" width="499" height="199" rx="16" fill="url(#hr_bg)" stroke="#2ac3de" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Header: HackerRank Logo + Username -->
  <g transform="translate(24, 20)">
    <!-- HackerRank Icon Hex / Square -->
    <rect x="0" y="0" width="32" height="32" rx="6" fill="#00EA64"/>
    <path d="M11 8h3v6h4V8h3v16h-3v-6h-4v6h-3V8z" fill="#0E1117"/>
    
    <text x="42" y="16" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="700" fill="#c0caf5">saptarshi-coder</text>
    <text x="42" y="30" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" fill="#565f89">HackerRank Verified Telemetry</text>
  </g>

  <!-- Badges Top Right -->
  <g transform="translate(360, 20)">
    <rect x="0" y="0" width="116" height="24" rx="12" fill="#00EA64" fill-opacity="0.12" stroke="#00EA64" stroke-opacity="0.4"/>
    <text x="58" y="16" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#00EA64">VERIFIED CODER</text>
  </g>

  <line x1="24" y1="62" x2="476" y2="62" stroke="#23283b" stroke-width="1"/>

  <!-- Rating Badges Columns -->
  <!-- 4 Star C -->
  <g transform="translate(24, 76)">
    <rect x="0" y="0" width="215" height="52" rx="10" fill="#13141f" stroke="#00EA64" stroke-opacity="0.3"/>
    <circle cx="26" cy="26" r="15" fill="#00EA64" fill-opacity="0.15"/>
    <text x="26" y="31" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#00EA64">C</text>
    
    <text x="50" y="21" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e0af68">★★★★☆</text>
    <text x="50" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#a9b1d6">4★ Gold Proficiency</text>
    <text x="175" y="31" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7aa2f7">C Lang</text>
  </g>

  <!-- 3 Star C++ -->
  <g transform="translate(261, 76)">
    <rect x="0" y="0" width="215" height="52" rx="10" fill="#13141f" stroke="#2ac3de" stroke-opacity="0.3"/>
    <circle cx="26" cy="26" r="15" fill="#2ac3de" fill-opacity="0.15"/>
    <text x="26" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#2ac3de">C++</text>
    
    <text x="50" y="21" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e0af68">★★★☆☆</text>
    <text x="50" y="38" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#a9b1d6">3★ Gold Proficiency</text>
    <text x="172" y="31" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#7aa2f7">Modern</text>
  </g>

  <!-- Competitive Honors Strip -->
  <g transform="translate(24, 140)">
    <rect x="0" y="0" width="452" height="46" rx="10" fill="#13141f" stroke="#24283b"/>
    
    <!-- Item 1 -->
    <text x="16" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#7dcfff">⚔️ Clash of Coders 2.0</text>
    <text x="16" y="36" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#565f89">Collegiate Finalist</text>

    <line x1="160" y1="10" x2="160" y2="36" stroke="#24283b" stroke-width="1"/>

    <!-- Item 2 -->
    <text x="175" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#bb9af7">🏆 Coding Premier League</text>
    <text x="175" y="36" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#565f89">Rank #4 Regional</text>

    <line x1="320" y1="10" x2="320" y2="36" stroke="#24283b" stroke-width="1"/>

    <!-- Item 3 -->
    <text x="335" y="22" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#9ece6a">⚡ Problem Solving</text>
    <text x="335" y="36" font-family="'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#565f89">DSA &amp; Systems Memory</text>
  </g>

</svg>