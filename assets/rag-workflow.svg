<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 210" width="100%" height="100%">
  <defs>
    <linearGradient id="ragbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <style>
      .r-box { fill: #0D1628; stroke: #1E293B; stroke-width: 1.2; rx: 8px; }
      .r-head { font-family: 'Fira Code', monospace; font-size: 11px; fill: #00E5FF; font-weight: bold; }
      .r-item { font-family: -apple-system, BlinkMacSystemFont, monospace; font-size: 10px; fill: #94A3B8; }
      .r-arrow { stroke: #00E5FF; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .r-badge-built { fill: #064E3B; stroke: #10B981; rx: 3px; }
      .r-badge-plan { fill: #451A03; stroke: #F59E0B; rx: 3px; }
      .r-badge-expl { fill: #0C4A6E; stroke: #0284C7; rx: 3px; }
    </style>
  </defs>

  <rect x="2" y="2" width="936" height="206" rx="10" fill="url(#ragbg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Step 1: Ingress -->
  <g transform="translate(25, 25)">
    <rect width="135" height="125" class="r-box"/>
    <rect width="135" height="3" fill="#3B82F6" rx="1.5"/>
    <text x="12" y="24" class="r-head" fill="#38BDF8">01 // INGRESS</text>
    <text x="12" y="46" class="r-item">• WhatsApp API</text>
    <text x="12" y="64" class="r-item">• Web / HTTP Hook</text>
    <text x="12" y="82" class="r-item">• User GPS Loc</text>
    <text x="12" y="104" class="r-item" fill="#10B981">[BUILT]</text>
  </g>

  <line x1="165" y1="87" x2="190" y2="87" class="r-arrow"/>
  <polygon points="190,84 196,87 190,90" fill="#00E5FF"/>

  <!-- Step 2: n8n Orchestrator -->
  <g transform="translate(195, 25)">
    <rect width="145" height="125" class="r-box"/>
    <rect width="145" height="3" fill="#EA580C" rx="1.5"/>
    <text x="12" y="24" class="r-head" fill="#FB923C">02 // n8n ROUTER</text>
    <text x="12" y="46" class="r-item">• State Machine</text>
    <text x="12" y="64" class="r-item">• Intent Extraction</text>
    <text x="12" y="82" class="r-item">• Schema Router</text>
    <text x="12" y="104" class="r-item" fill="#10B981">[BUILT]</text>
  </g>

  <line x1="345" y1="87" x2="370" y2="87" class="r-arrow"/>
  <polygon points="370,84 376,87 370,90" fill="#00E5FF"/>

  <!-- Step 3: Spatial Database & RAG -->
  <g transform="translate(375, 25)">
    <rect width="155" height="125" class="r-box"/>
    <rect width="155" height="3" fill="#10B981" rx="1.5"/>
    <text x="12" y="24" class="r-head" fill="#10B981">03 // SPATIAL RAG</text>
    <text x="12" y="46" class="r-item">• 3,000+ Pandals</text>
    <text x="12" y="64" class="r-item">• PostGIS Spatial DB</text>
    <text x="12" y="82" class="r-item">• Vector Nearest-K</text>
    <text x="12" y="104" class="r-item" fill="#10B981">[BUILT: GEO-SET]</text>
  </g>

  <line x1="535" y1="87" x2="560" y2="87" class="r-arrow"/>
  <polygon points="560,84 566,87 560,90" fill="#00E5FF"/>

  <!-- Step 4: Gemini Pro Reasoning -->
  <g transform="translate(565, 25)">
    <rect width="165" height="125" class="r-box"/>
    <rect width="165" height="3" fill="#00E5FF" rx="1.5"/>
    <text x="12" y="24" class="r-head">04 // GEMINI AI</text>
    <text x="12" y="46" class="r-item">• Prompt Graph Engine</text>
    <text x="12" y="64" class="r-item">• Bengali · Hindi · EN</text>
    <text x="12" y="82" class="r-item">• Route Optimization</text>
    <text x="12" y="104" class="r-item" fill="#10B981">• Context Validation</text>
  </g>

  <line x1="735" y1="87" x2="760" y2="87" class="r-arrow"/>
  <polygon points="760,84 766,87 760,90" fill="#00E5FF"/>

  <!-- Step 5: Validated Egress -->
  <g transform="translate(765, 25)">
    <rect width="145" height="125" class="r-box"/>
    <rect width="145" height="3" fill="#8B5CF6" rx="1.5"/>
    <text x="12" y="24" class="r-head" fill="#A78BFA">05 // EGRESS</text>
    <text x="12" y="46" class="r-item">• Strict JSON Payload</text>
    <text x="12" y="64" class="r-item">• Map Tile Routing</text>
    <text x="12" y="82" class="r-item">• Low-Latency Delivery</text>
    <text x="12" y="104" class="r-item" fill="#10B981">• Webhook Response</text>
  </g>

  <!-- Legend Bar -->
  <g transform="translate(25, 175)" font-family="monospace" font-size="10">
    <rect x="0" y="0" width="80" height="20" class="r-badge-built"/>
    <text x="12" y="14" fill="#10B981" font-weight="bold">[● ACTIVE]</text>
    <text x="90" y="14" fill="#94A3B8">PostGIS Geospatial Engine · Gemini Reasoning Runtime · n8n State Machine Orchestration</text>
  </g>
</svg>