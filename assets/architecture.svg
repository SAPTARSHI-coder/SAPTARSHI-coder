      .node-accent { font-family: 'Fira Code', monospace; font-size: 10px; fill: #38BDF8; font-weight: bold; }
      .bus-line { stroke: #00E5FF; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .bus-amber { stroke: #F59E0B; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .bus-green { stroke: #10B981; stroke-width: 1.5; stroke-dasharray: 4,3; }
