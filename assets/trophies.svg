    <text x="890" y="0" text-anchor="end" font-family="monospace" font-size="10" fill="#64748B">VERIFIED ON-CHAIN &amp; REPO AUDITED</text>
  </g>

  <!-- Trophy 1: PR Maestro -->
  <g transform="translate(25, 36)">
    <rect width="140" height="100" class="tr-card" stroke="#F59E0B"/>
    <circle cx="70" cy="30" r="16" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="70" y="36" text-anchor="middle" font-size="16">🏆</text>
    <text x="70" y="62" text-anchor="middle" class="tr-grade" fill="#FBBF24">SSS+</text>
    <text x="70" y="77" text-anchor="middle" class="tr-title">PR Maestro</text>
    <text x="70" y="90" text-anchor="middle" class="tr-desc">12,000+ Merged</text>
  </g>

  <!-- Trophy 2: National Rank #2 -->
  <g transform="translate(175, 36)">
    <rect width="140" height="100" class="tr-card" stroke="#10B981"/>
    <circle cx="70" cy="30" r="16" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
    <text x="70" y="36" text-anchor="middle" font-size="16">🇮🇳</text>
    <text x="70" y="62" text-anchor="middle" class="tr-grade" fill="#34D399">SSS</text>
    <text x="70" y="77" text-anchor="middle" class="tr-title">Rank #2 India</text>
    <text x="70" y="90" text-anchor="middle" class="tr-desc">committers.top</text>
  </g>

  <!-- Trophy 3: 24h Hyper Sprint -->
  <g transform="translate(325, 36)">
    <rect width="140" height="100" class="tr-card" stroke="#00E5FF"/>
    <circle cx="70" cy="30" r="16" fill="#0C4A6E" stroke="#00E5FF" stroke-width="1.5"/>
    <text x="70" y="36" text-anchor="middle" font-size="16">⚡</text>
    <text x="70" y="62" text-anchor="middle" class="tr-grade" fill="#38BDF8">SSS</text>
    <text x="70" y="77" text-anchor="middle" class="tr-title">Hyper Sprint</text>
    <text x="70" y="90" text-anchor="middle" class="tr-desc">1,300+ in 24h</text>
  </g>

  <!-- Trophy 4: Ecosystem Architect -->
