    <rect width="140" height="100" class="tr-card" stroke="#EC4899"/>
    <circle cx="70" cy="30" r="16" fill="#500724" stroke="#EC4899" stroke-width="1.5"/>
    <text x="70" y="36" text-anchor="middle" font-size="16">✨</text>
    <text x="70" y="62" text-anchor="middle" class="tr-grade" fill="#F472B6">SS+</text>
    <text x="70" y="77" text-anchor="middle" class="tr-title">Gemini Fellow</text>
    <text x="70" y="90" text-anchor="middle" class="tr-desc">Ambassador '26</text>
