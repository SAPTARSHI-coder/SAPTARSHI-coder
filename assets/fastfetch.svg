<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%">
  <defs>
    <linearGradient id="term_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="cyan_glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <style>
      .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94A3B8; font-weight: 500; }
      .t-prompt { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 12.5px; fill: #10B981; font-weight: 600; }
      .t-cmd { fill: #F8FAFC; font-weight: normal; }
      .t-key { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 11.5px; fill: #00E5FF; font-weight: bold; }
      .t-val { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 11.5px; fill: #E2E8F0; }
      .t-dim { fill: #64748B; }
      .t-cyan { fill: #00E5FF; }
      .t-green { fill: #10B981; }
      .t-purple { fill: #C084FC; }
      .t-amber { fill: #FBBF24; }
      .t-art { font-family: 'Courier New', monospace; font-size: 12px; fill: #00E5FF; font-weight: bold; line-height: 14px; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="936" height="326" rx="10" fill="url(#term_bg)" stroke="#1E293B" stroke-width="1.2"/>
  
  <!-- Window Title Bar -->
  <path d="M 2 12 C 2 6.5 6.5 2 12 2 L 928 2 C 933.5 2 938 6.5 938 12 L 938 36 L 2 36 Z" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
  
  <!-- Window Control Buttons -->
  <circle cx="22" cy="19" r="6" fill="#EF4444"/>
  <circle cx="42" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="62" cy="19" r="6" fill="#10B981"/>
  
  <!-- Window Title -->
  <text x="470" y="23" text-anchor="middle" class="t-title">saptarshi@research-node: ~ (fastfetch --os-release)</text>
  <text x="915" y="23" text-anchor="end" font-family="monospace" font-size="10" fill="#00E5FF">TTY: 0x4E9A</text>

  <!-- Prompt Command -->
  <g transform="translate(25, 60)">
    <text x="0" y="0" class="t-prompt">saptarshi@research-node:~$ <tspan class="t-cmd">fastfetch --profile research-core</tspan></text>
  </g>

  <!-- Terminal Content Columns -->
  <!-- Left Column: Cyber ASCII / Logo Graphic -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="200" height="215" rx="8" fill="#0A0F1A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Stylized Pixel / ASCII Node Art -->
    <g transform="translate(20, 20)">
      <text x="0" y="15" class="t-art">      /\_/\     </text>
      <text x="0" y="30" class="t-art">     ( o.o )    </text>
      <text x="0" y="45" class="t-art">     &gt; ^ &lt;     </text>
      <text x="0" y="65" class="t-art" fill="#38BDF8"> ┌─────────────┐</text>
      <text x="0" y="80" class="t-art" fill="#38BDF8"> │ RESEARCH OS │</text>
      <text x="0" y="95" class="t-art" fill="#38BDF8"> └─────────────┘</text>
      <text x="0" y="115" class="t-art" fill="#10B981"> [AI/ML · GeoAI]</text>
      <text x="0" y="130" class="t-art" fill="#10B981"> [ROS 2 · Edge] </text>
      <text x="0" y="145" class="t-art" fill="#C084FC"> [FOSS · 12k PR]</text>
      <text x="0" y="165" class="t-art" fill="#F59E0B"> &gt;&gt; RANK #2 IN &lt;&lt;</text>
    </g>
  </g>

  <!-- Right Column: Fastfetch Specs Table -->
  <g transform="translate(255, 92)">
    <text x="0" y="0" class="t-key">OS<tspan class="t-dim"> .......... </tspan><tspan class="t-val">Arch Linux x86_64 / Research Core Node</tspan></text>
    <text x="0" y="19" class="t-key">Host<tspan class="t-dim"> ........ </tspan><tspan class="t-val">Adamas University ──► <tspan class="t-cyan">IISc Bengaluru (ACM '26)</tspan></tspan></text>
    <text x="0" y="38" class="t-key">Kernel<tspan class="t-dim"> ...... </tspan><tspan class="t-val">Applied AI/ML &amp; Physical Systems <tspan class="t-purple">(B.Tech CSE '26)</tspan></tspan></text>
    <text x="0" y="57" class="t-key">Uptime<tspan class="t-dim"> ...... </tspan><tspan class="t-val">3rd Year Active Deployment <tspan class="t-green">[Continuous Active Status]</tspan></tspan></text>
    <text x="0" y="76" class="t-key">Shell<tspan class="t-dim"> ....... </tspan><tspan class="t-val">zsh 5.9 · ROS 2 Galactic · Bash · Python 3.12</tspan></text>
    <text x="0" y="95" class="t-key">Research<tspan class="t-dim"> .... </tspan><tspan class="t-val">Urban Air Quality ML <tspan class="t-amber">(VOCs, O₃, NOx, GEE, Nature Cities)</tspan></tspan></text>
    <text x="0" y="114" class="t-key">Edge AI<tspan class="t-dim"> ..... </tspan><tspan class="t-val">ACM India Summer School '26 @ IISc Bengaluru</tspan></text>
    <text x="0" y="133" class="t-key">FOSS Lead<tspan class="t-dim"> ... </tspan><tspan class="t-val">EaseMotion CSS Maintainer <tspan class="t-cyan">[Rank #2 in India on committers.top]</tspan></tspan></text>
    <text x="0" y="152" class="t-key">Velocity<tspan class="t-dim"> .... </tspan><tspan class="t-val">12,000+ PRs Merged · 1,300+ Commits in 24h Sprint</tspan></text>
    <text x="0" y="171" class="t-key">Hardware<tspan class="t-dim"> .... </tspan><tspan class="t-val">Edge Silicon · Embedded PM/VOC Sensors · Jetson/RPi</tspan></text>
    
    <!-- Fastfetch Color Palette Blocks -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="28" height="12" rx="3" fill="#1E293B"/>
      <rect x="34" y="0" width="28" height="12" rx="3" fill="#EF4444"/>
      <rect x="68" y="0" width="28" height="12" rx="3" fill="#10B981"/>
      <rect x="102" y="0" width="28" height="12" rx="3" fill="#F59E0B"/>
      <rect x="136" y="0" width="28" height="12" rx="3" fill="#3B82F6"/>
      <rect x="170" y="0" width="28" height="12" rx="3" fill="#A855F7"/>
      <rect x="204" y="0" width="28" height="12" rx="3" fill="#00E5FF"/>
      <rect x="238" y="0" width="28" height="12" rx="3" fill="#F8FAFC"/>

      <rect x="300" y="0" width="28" height="12" rx="3" fill="#334155"/>
      <rect x="334" y="0" width="28" height="12" rx="3" fill="#F87171"/>
      <rect x="368" y="0" width="28" height="12" rx="3" fill="#34D399"/>
      <rect x="402" y="0" width="28" height="12" rx="3" fill="#FBBF24"/>
      <rect x="436" y="0" width="28" height="12" rx="3" fill="#60A5FA"/>
      <rect x="470" y="0" width="28" height="12" rx="3" fill="#C084FC"/>
      <rect x="504" y="0" width="28" height="12" rx="3" fill="#38BDF8"/>
      <rect x="538" y="0" width="28" height="12" rx="3" fill="#FFFFFF"/>
    </g>
  </g>
</svg>