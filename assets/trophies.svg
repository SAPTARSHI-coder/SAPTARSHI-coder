<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 155" width="100%" height="100%">
  <defs>
    <linearGradient id="t_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C1220"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="purple_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <style>
      .tr-card { fill: #0F172A; stroke: #1E293B; stroke-width: 1.2; rx: 8px; }
      .tr-grade { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; font-weight: 900; }
      .tr-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .tr-desc { font-family: 'Fira Code', monospace; font-size: 9.5px; fill: #94A3B8; }
    </style>
  </defs>

  <rect x="2" y="2" width="936" height="151" rx="10" fill="url(#t_bg)" stroke="#1E293B" stroke-width="1.2"/>
  
  <!-- Header strip -->
  <g transform="translate(25, 20)">
