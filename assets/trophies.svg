    <circle cx="70" cy="30" r="16" fill="#3B0764" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="70" y="36" text-anchor="middle" font-size="16">👥</text>
    <text x="70" y="62" text-anchor="middle" class="tr-grade" fill="#C084FC">SS+</text>
