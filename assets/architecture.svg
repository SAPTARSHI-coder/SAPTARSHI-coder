<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="100%">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <style>
      .node-card { fill: #0D1628; stroke: #1E293B; stroke-width: 1.2; rx: 8px; }
      .node-core { fill: #0F1E36; stroke: #00E5FF; stroke-width: 1.5; rx: 8px; }
      .node-title { font-family: 'Fira Code', monospace; font-size: 11.5px; fill: #00E5FF; font-weight: bold; }
