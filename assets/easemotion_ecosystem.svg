<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="100%">
  <defs>
    <linearGradient id="ossBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <style>
      .oss-card { fill: #0D1628; stroke: #1E293B; stroke-width: 1.2; rx: 8px; }
      .oss-head { font-family: 'Fira Code', monospace; font-size: 11px; fill: #10B981; font-weight: bold; }
      .oss-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #94A3B8; }
      .oss-link { stroke: #10B981; stroke-width: 1.5; stroke-dasharray: 4,3; }
    </style>
  </defs>

  <rect x="2" y="2" width="936" height="176" rx="10" fill="url(#ossBg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Module 1 -->
  <g transform="translate(25, 25)">
    <rect width="200" height="125" class="oss-card"/>
    <rect width="200" height="3" fill="#10B981" rx="1.5"/>
    <text x="14" y="26" class="oss-head">01 // COMMUNITY INGRESS</text>
    <text x="14" y="50" class="oss-desc">• 500+ Global Contributors</text>
    <text x="14" y="70" class="oss-desc">• GSSoC Mentorship Cohorts</text>
    <text x="14" y="90" class="oss-desc">• Issue Triage &amp; Label Taxonomy</text>
    <text x="14" y="110" class="oss-desc" fill="#38BDF8">Structured First-Timer Onboarding</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="230" y1="87" x2="260" y2="87" class="oss-link"/>
  <polygon points="260,84 266,87 260,90" fill="#10B981"/>

  <!-- Module 2 -->
  <g transform="translate(270, 25)">
    <rect width="200" height="125" class="oss-card"/>
    <rect width="200" height="3" fill="#00E5FF" rx="1.5"/>
    <text x="14" y="26" class="oss-head" fill="#00E5FF">02 // AUTOMATION GATES</text>
    <text x="14" y="50" class="oss-desc">• GitHub Actions CI/CD</text>
    <text x="14" y="70" class="oss-desc">• Automated Lint &amp; CSS Minify</text>
    <text x="14" y="90" class="oss-desc">• 60fps Performance Benchmarks</text>
    <text x="14" y="110" class="oss-desc" fill="#38BDF8">Regression Testing &amp; Bot Guard</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="475" y1="87" x2="505" y2="87" class="oss-link"/>
  <polygon points="505,84 511,87 505,90" fill="#10B981"/>

  <!-- Module 3 -->
  <g transform="translate(515, 25)">
    <rect width="200" height="125" class="oss-card"/>
    <rect width="200" height="3" fill="#F59E0B" rx="1.5"/>
    <text x="14" y="26" class="oss-head" fill="#F59E0B">03 // ORCHESTRATION</text>
    <text x="14" y="50" class="oss-desc">• 12,000+ PRs Merged</text>
    <text x="14" y="70" class="oss-desc">• Peak 1,300+ Commits/Day</text>
    <text x="14" y="90" class="oss-desc">• Architectural Review Cycles</text>
    <text x="14" y="110" class="oss-desc" fill="#10B981">Ranked #2 Top Contributor in IN</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="720" y1="87" x2="750" y2="87" class="oss-link"/>
  <polygon points="750,84 756,87 750,90" fill="#10B981"/>

  <!-- Module 4 -->
  <g transform="translate(760, 25)">
    <rect width="155" height="125" class="oss-card" stroke="#38BDF8"/>
    <rect width="155" height="3" fill="#38BDF8" rx="1.5"/>
    <text x="12" y="26" class="oss-head" fill="#38BDF8">04 // SHIP &amp; EGRESS</text>
    <text x="12" y="50" class="oss-desc">• NPM Package Release</text>
    <text x="12" y="70" class="oss-desc">• CDN Distribution</text>
    <text x="12" y="90" class="oss-desc">• Zero-Dependency Spec</text>
    <text x="12" y="110" class="oss-desc" fill="#00E5FF">easemotion-css v-pkg</text>
  </g>
</svg>