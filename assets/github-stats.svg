<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 215" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Obsidian Background -->
    <linearGradient id="stats_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>

    <!-- Cyan Laser Border -->
    <linearGradient id="stats_border_laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Cyan Glowing Gradient -->
    <linearGradient id="cyan_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emerald_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Gold Glow -->
    <linearGradient id="gold_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Purple Glow -->
    <linearGradient id="purple_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="laser_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .stat-title { font-size: 10px; font-weight: 700; letter-spacing: 1px; fill: #94A3B8; text-transform: uppercase; }
      .stat-val-large { font-size: 22px; font-weight: 900; }
      .stat-sub { font-size: 9px; fill: #64748B; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="536" height="211" rx="12" fill="url(#stats_bg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Animated Circulating Laser Border -->
  <rect x="2" y="2" width="536" height="211" rx="12" fill="none" stroke="url(#stats_border_laser)" stroke-width="2" stroke-dasharray="140 380" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="1040" to="0" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Top Cyan Energy Bar -->
  <rect x="12" y="3" width="516" height="3" rx="1.5" fill="url(#cyan_glow)" filter="url(#laser_glow)">
    <animate attributeName="opacity" values="0.75; 1; 0.75" dur="2s" repeatCount="indefinite" />
  </rect>

  <!-- Header Banner -->
  <g transform="translate(20, 24)">
    <!-- Blinking Emerald Status LED -->
    <circle cx="6" cy="-4" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="1; 0.25; 1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="6" cy="-4" r="7" fill="none" stroke="#10B981" stroke-width="1">
      <animate attributeName="r" values="4; 10; 4" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8; 0; 0.8" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="20" y="0" class="mono-text" font-size="12" font-weight="800" fill="#E2E8F0" letter-spacing="1">
      CORE TELEMETRY <tspan fill="#64748B">//</tspan> <tspan fill="#00E5FF">ENGINEERING AUDIT</tspan>
    </text>
    <text x="500" y="0" text-anchor="end" class="mono-text" font-size="9" font-weight="700" fill="#10B981">
      ONLINE [200 OK]
    </text>
  </g>

  <!-- Horizontal Divider -->
  <line x1="20" y1="36" x2="520" y2="36" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Left Side: Circular Rotating Reticle & Overall Velocity Gauge -->
  <g transform="translate(75, 115)">
    <!-- Outer Static Ring -->
    <circle cx="0" cy="0" r="48" fill="#0C1425" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#334155" stroke-dasharray="3 4"/>
    
    <!-- Rotating Cyber Reticle Ring -->
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="40 80 20 60">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="25 50">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Center GitHub Hex Hub -->
    <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="#1E293B" stroke="#00E5FF" stroke-width="1.2">
      <animate attributeName="stroke-opacity" values="0.5; 1; 0.5" dur="1.5s" repeatCount="indefinite"/>
    </polygon>
    
    <!-- Core Icon -->
    <text x="0" y="5" text-anchor="middle" font-size="14">⚡</text>

    <!-- Below Gauge Label -->
    <text x="0" y="65" text-anchor="middle" class="mono-text" font-size="9" font-weight="700" fill="#00E5FF">GOD TIER</text>
    <text x="0" y="77" text-anchor="middle" class="sans-text" font-size="8" fill="#64748B">VELOCITY INDEX</text>
  </g>

  <!-- Right Side: 4 Core Verified Telemetry Rows -->
  <g transform="translate(160, 48)">

    <!-- ROW 1: TOTAL COMMITS -->
    <g transform="translate(0, 16)">
      <circle cx="8" cy="8" r="3" fill="#00E5FF"/>
      <text x="18" y="12" class="sans-text stat-title">TOTAL COMMITS REACHED</text>
      <text x="350" y="12" text-anchor="end" class="mono-text stat-val-large" fill="url(#cyan_glow)">103,042+</text>
      <rect x="18" y="20" width="332" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="18" y="20" width="324" height="3" rx="1.5" fill="#00E5FF">
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ROW 2: MERGED PULL REQUESTS -->
    <g transform="translate(0, 52)">
      <circle cx="8" cy="8" r="3" fill="#10B981"/>
      <text x="18" y="12" class="sans-text stat-title">MERGED PULL REQUESTS</text>
      <text x="350" y="12" text-anchor="end" class="mono-text stat-val-large" fill="url(#emerald_glow)">44,078</text>
      <rect x="18" y="20" width="332" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="18" y="20" width="298" height="3" rx="1.5" fill="#10B981">
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ROW 3: CLOSED ISSUES RESOLVED -->
    <g transform="translate(0, 88)">
      <circle cx="8" cy="8" r="3" fill="#A855F7"/>
      <text x="18" y="12" class="sans-text stat-title">CLOSED ISSUES &amp; RESOLUTIONS</text>
      <text x="350" y="12" text-anchor="end" class="mono-text stat-val-large" fill="url(#purple_glow)">37,729</text>
      <rect x="18" y="20" width="332" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="18" y="20" width="280" height="3" rx="1.5" fill="#A855F7">
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ROW 4: TOP CONTRIBUTOR STANDING -->
    <g transform="translate(0, 124)">
      <circle cx="8" cy="8" r="3" fill="#F59E0B"/>
      <text x="18" y="12" class="sans-text stat-title">committers.top PUBLIC RANK</text>
      <text x="350" y="12" text-anchor="end" class="mono-text stat-val-large" fill="url(#gold_glow)">#2 IN INDIA</text>
      <rect x="18" y="20" width="332" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="18" y="20" width="328" height="3" rx="1.5" fill="#F59E0B">
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Bottom Micro Telemetry Ticker -->
  <g transform="translate(270, 202)">
    <text text-anchor="middle" class="mono-text" font-size="8.5" fill="#475569" letter-spacing="1">
      51,055 TOTAL PRS · 1,126 FORKS · 855 CONTRIBUTORS · 1,300+ SPRINT COMMITS/24H
    </text>
  </g>
</svg>