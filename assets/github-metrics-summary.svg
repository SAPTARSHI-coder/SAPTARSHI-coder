<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" width="100%" height="100%">
  <defs>
    <linearGradient id="m_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <style>
      .m-card { fill: #0A101D; stroke: #1E293B; stroke-width: 1.2; rx: 8px; }
      .m-head { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .m-row { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11.5px; fill: #94A3B8; }
      .m-val { font-family: 'Fira Code', monospace; font-size: 11.5px; font-weight: bold; fill: #F8FAFC; }
    </style>
  </defs>

  <rect x="2" y="2" width="936" height="246" rx="10" fill="url(#m_bg)" stroke="#1E293B" stroke-width="1.2"/>

  <!-- Left Card: Core Activity Telemetry -->
  <g transform="translate(25, 20)">
    <rect width="275" height="210" class="m-card"/>
    <text x="16" y="26" class="m-head" fill="#00E5FF">GitHub Activity Telemetry</text>
    <line x1="16" y1="36" x2="259" y2="36" stroke="#1E293B" stroke-width="1"/>

    <g transform="translate(16, 56)">
      <text x="0" y="0" class="m-row">★ Stars Earned:</text>
      <text x="240" y="0" text-anchor="end" class="m-val" fill="#FBBF24">800+</text>

      <text x="0" y="25" class="m-row">⑂ Pull Requests Merged:</text>
      <text x="240" y="25" text-anchor="end" class="m-val" fill="#38BDF8">12,000+</text>

      <text x="0" y="50" class="m-row">● Peak 24h Commits:</text>
      <text x="240" y="50" text-anchor="end" class="m-val" fill="#10B981">1,300+</text>

      <text x="0" y="75" class="m-row">👥 Contributors Mentored:</text>
      <text x="240" y="75" text-anchor="end" class="m-val" fill="#C084FC">500+</text>

      <text x="0" y="100" class="m-row">📦 Active Repositories:</text>
      <text x="240" y="100" text-anchor="end" class="m-val" fill="#E2E8F0">40+</text>

      <text x="0" y="125" class="m-row">🇮🇳 committers.top Rank:</text>
      <text x="240" y="125" text-anchor="end" class="m-val" fill="#00E5FF">#2 in India</text>
    </g>
  </g>

  <!-- Middle Card: Language Distribution Donut -->
  <g transform="translate(320, 20)">
    <rect width="310" height="210" class="m-card"/>
    <text x="16" y="26" class="m-head" fill="#38BDF8">Top Languages by Impact</text>
    <line x1="16" y1="36" x2="294" y2="36" stroke="#1E293B" stroke-width="1"/>

    <!-- Donut Chart SVG (center: 75, 125, r: 45, stroke-width: 18) -->
    <!-- Circumference = 2 * pi * 45 = 282.74 -->
    <!-- Python 42% = 118.7 -->
    <!-- JS/CSS 34% = 96.1 -->
    <!-- C++ 14% = 39.6 -->
    <!-- SQL/Others 10% = 28.3 -->
    <g transform="translate(75, 125)">
      <circle r="45" fill="none" stroke="#1E293B" stroke-width="20"/>
      <!-- Python -->
      <circle r="45" fill="none" stroke="#00E5FF" stroke-width="20"
              stroke-dasharray="118.7 282.74" stroke-dashoffset="0"/>
      <!-- JS/CSS -->
      <circle r="45" fill="none" stroke="#F59E0B" stroke-width="20"
              stroke-dasharray="96.1 282.74" stroke-dashoffset="-118.7"/>
      <!-- C++ -->
      <circle r="45" fill="none" stroke="#3B82F6" stroke-width="20"
              stroke-dasharray="39.6 282.74" stroke-dashoffset="-214.8"/>
      <!-- SQL/Geospatial -->
      <circle r="45" fill="none" stroke="#10B981" stroke-width="20"
              stroke-dasharray="28.3 282.74" stroke-dashoffset="-254.4"/>
      <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF">42% PY</text>
    </g>

    <!-- Legend -->
    <g transform="translate(160, 65)">
      <circle cx="6" cy="6" r="5" fill="#00E5FF"/>
      <text x="18" y="10" class="m-row"><tspan font-weight="bold" fill="#F8FAFC">Python</tspan> (42%)</text>

      <circle cx="6" cy="36" r="5" fill="#F59E0B"/>
      <text x="18" y="40" class="m-row"><tspan font-weight="bold" fill="#F8FAFC">JS / CSS</tspan> (34%)</text>

      <circle cx="6" cy="66" r="5" fill="#3B82F6"/>
      <text x="18" y="70" class="m-row"><tspan font-weight="bold" fill="#F8FAFC">C / C++</tspan> (14%)</text>

      <circle cx="6" cy="96" r="5" fill="#10B981"/>
      <text x="18" y="100" class="m-row"><tspan font-weight="bold" fill="#F8FAFC">SQL &amp; Geo</tspan> (10%)</text>
    </g>
  </g>

  <!-- Right Card: Commit Time & Velocity Profile -->
  <g transform="translate(650, 20)">
    <rect width="265" height="210" class="m-card"/>
    <text x="16" y="26" class="m-head" fill="#10B981">Commit Distribution (UTC)</text>
    <line x1="16" y1="36" x2="249" y2="36" stroke="#1E293B" stroke-width="1"/>

    <!-- Bar chart simulation -->
    <g transform="translate(16, 50)">
      <text x="0" y="10" font-family="monospace" font-size="9.5" fill="#64748B">HOURLY COMMIT INTENSITY (00h - 23h)</text>
      
      <!-- Bars -->
      <g transform="translate(0, 25)">
        <!-- 12 dual-hour bars -->
        <!-- 00-02 --> <rect x="0" y="25" width="14" height="60" rx="2" fill="#00E5FF"/>
        <!-- 02-04 --> <rect x="19" y="55" width="14" height="30" rx="2" fill="#0284C7"/>
        <!-- 04-06 --> <rect x="38" y="75" width="14" height="10" rx="2" fill="#1E293B"/>
        <!-- 06-08 --> <rect x="57" y="65" width="14" height="20" rx="2" fill="#1E293B"/>
        <!-- 08-10 --> <rect x="76" y="45" width="14" height="40" rx="2" fill="#0284C7"/>
        <!-- 10-12 --> <rect x="95" y="30" width="14" height="55" rx="2" fill="#00E5FF"/>
        <!-- 12-14 --> <rect x="114" y="20" width="14" height="65" rx="2" fill="#00E5FF"/>
        <!-- 14-16 --> <rect x="133" y="10" width="14" height="75" rx="2" fill="#10B981"/>
        <!-- 16-18 --> <rect x="152" y="5" width="14" height="80" rx="2" fill="#10B981"/>
        <!-- 18-20 --> <rect x="171" y="15" width="14" height="70" rx="2" fill="#10B981"/>
        <!-- 20-22 --> <rect x="190" y="0" width="14" height="85" rx="2" fill="#F59E0B"/>
        <!-- 22-24 --> <rect x="209" y="10" width="14" height="75" rx="2" fill="#00E5FF"/>
      </g>
      
      <!-- Baseline -->
      <line x1="0" y1="112" x2="230" y2="112" stroke="#334155" stroke-width="1"/>
      <text x="0" y="125" font-family="monospace" font-size="9" fill="#64748B">00h</text>
      <text x="105" y="125" font-family="monospace" font-size="9" fill="#64748B">12h</text>
      <text x="210" y="125" font-family="monospace" font-size="9" fill="#64748B">24h</text>

      <!-- Key Insight -->
      <rect x="0" y="135" width="233" height="25" rx="4" fill="#0F172A" stroke="#334155"/>
      <text x="8" y="151" font-family="monospace" font-size="9.5" fill="#38BDF8">⚡ Peak Sprint: Late-Night Sync (20-02h)</text>
    </g>
  </g>
</svg>